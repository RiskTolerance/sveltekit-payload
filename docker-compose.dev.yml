# docker-compose.dev.yml
# Development stack: Uses external database (Coolify) with network configs

services:
  # ============================================
  # Payload CMS (Admin + API)
  # ============================================
  cms:
    build:
      context: ./apps/cms
      dockerfile: Dockerfile
    container_name: cms
    restart: unless-stopped
    ports:
      - "4000:3000"
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:?Required}@${DB_HOST:?Required}:${DB_PORT:-5432}/${DB_NAME:-payload}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Required}
      NODE_ENV: production
    volumes:
      - cms_media:/app/media
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/admin"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - frontend

  # ============================================
  # SvelteKit Frontend
  # ============================================
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: web
    restart: unless-stopped
    ports:
      - "4001:5173"
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:?Required}@${DB_HOST:?Required}:${DB_PORT:-5432}/${DB_NAME:-payload}?schema=app
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Required}
      NODE_ENV: production
      PORT: "5173"
      HOST: "0.0.0.0"
      ORIGIN: ${ORIGIN:-http://localhost:5173}
      PAYLOAD_URL: http://cms:3000
      PUBLIC_PAYLOAD_URL: http://localhost:4000
    depends_on:
      cms:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - frontend

networks:
  frontend:
    driver: bridge

volumes:
  cms_media: