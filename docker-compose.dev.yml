services:
  db:
    image: postgres:17-alpine
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-payload}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-payload}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================
  # CMS - Development Mode with Live Reload
  # ============================================
  cms:
    image: node:22-alpine
    container_name: cms
    working_dir: /app
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-payload}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Required}
      NODE_ENV: development
      PORT: '3000'
      HOST: '0.0.0.0'
    volumes:
      - ./apps/cms:/app
      - cms_node_modules:/app/node_modules
      - cms_media:/app/media
    command: sh -c "pnpm install && pnpm run dev"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://localhost:3000/admin > /dev/null 2>&1 || exit 1',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s

  # ============================================
  # SvelteKit Frontend - Development Mode with Live Reload
  # ============================================
  web:
    image: oven/bun:1-alpine
    container_name: web
    working_dir: /app
    ports:
      - '5173:5173'
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-payload}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Required}
      NODE_ENV: development
      PORT: '5173'
      HOST: '0.0.0.0'
      ORIGIN: ${ORIGIN:-http://localhost:5173}
      PAYLOAD_URL: http://cms:3000
      PUBLIC_PAYLOAD_URL: http://cms:3000
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    command: sh -c "bun install && bun run dev -- --host"
    depends_on:
      cms:
        condition: service_healthy

volumes:
  postgres_data:
  cms_node_modules:
  web_node_modules:
  cms_media:
