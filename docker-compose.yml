services:
  cms:
    build:
      context: ./apps/cms
      dockerfile: Dockerfile
    container_name: cms
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:?Required}@${DB_HOST:?Required}:5432/payload
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Required}
      NODE_ENV: production
    volumes:
      - cms_media:/app/media
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/admin"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ============================================
  # SvelteKit Frontend
  # ============================================
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: web
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Required}
      NODE_ENV: production
      PORT: "5173"
      HOST: "0.0.0.0"
      ORIGIN: ${ORIGIN:-http://localhost:5173}
      PAYLOAD_URL: http://cms:3000
      PUBLIC_PAYLOAD_URL: http://cms:3000
    depends_on:
      cms:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  cms_media: